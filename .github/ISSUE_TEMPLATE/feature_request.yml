name: Feature request
description: Propose an improvement or a new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and who runs into it. A concrete use case beats an abstract one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Interakt to do? Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you tried, or other ways this could be solved.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Admin UI
        - Search
        - AI chat / pipeline
        - Widgets
        - Public API / ingestion
        - Data sources / indexing
        - Integrations
        - Docs
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this
